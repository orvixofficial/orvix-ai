<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Orvix AI</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="logo">Orvix<span>.AI</span></div>
      <h2>Create Account</h2>
      <p>নতুন অ্যাকাউন্ট তৈরি করুন</p>

      <form id="signupForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="name@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
      </form>

      <!-- Google Sign Up Button -->
      <div style="margin: 15px 0; text-align: center;">
        <p style="margin-bottom: 10px; color: #666;">অথবা</p>
        <button type="button" onclick="signInWithGoogle()" class="btn btn-block" style="background: #fff; color: #333; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 10px; cursor: pointer; border-radius: 6px;">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="18">
          Sign up with Google
        </button>
      </div>

      <p class="auth-footer">
        আগে থেকেই অ্যাকাউন্ট আছে? <a href="login.html">Sign In করুন</a>
      </p>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
