<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orvix AI - Signup</title>
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="margin: 0; font-family: sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh;">

  <div style="background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 100%; max-width: 400px; border: 1px solid #334155;">
    <h2 style="text-align: center; margin-bottom: 24px; font-size: 24px;">নতুন অ্যাকাউন্ট তৈরি করুন</h2>
    
    <div id="message" style="margin-bottom: 15px; font-size: 14px; text-align: center;"></div>

    <form id="signup-form">
      <div style="margin-bottom: 15px;">
        <label style="display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px;">ইমেইল এড্রেস</label>
        <input type="email" id="signup-email" required placeholder="example@domain.com" style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; box-sizing: border-box;">
      </div>
      
      <div style="margin-bottom: 20px;">
        <label style="display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px;">পাসওয়ার্ড</label>
        <input type="password" id="signup-password" required placeholder="••••••••" style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; box-sizing: border-box;">
      </div>

      <button type="submit" style="width: 100%; padding: 12px; background: #3b82f6; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;">সাইন আপ</button>
    </form>

    <p style="text-align: center; margin-top: 20px; font-size: 13px; color: #94a3b8;">
      ইতিমধ্যে অ্যাকাউন্ট আছে? <a href="login.html" style="color: #3b82f6; text-decoration: none; font-weight: bold;">লগইন করুন</a>
    </p>
  </div>

  <script>
    const SUPABASE_URL = 'https://evdchqddhuzbgyexdnyq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV2ZGNoaWRkaHV6Ymd5ZXhkbnlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA2ODYwNzUsImV4cCI6MjA2NjI2MjA3NX0.zVvG5Vq7vYvG5Vq7vYvG5Vq7vYvG5Vq7vYvG5Vq7vYv';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const msgDiv = document.getElementById('message');

      const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password
      });

      if (error) {
        msgDiv.style.color = '#ef4444';
        msgDiv.textContent = 'এরর: ' + error.message;
      } else {
        msgDiv.style.color = '#22c55e';
        msgDiv.textContent = 'সফলভাবে অ্যাকাউন্ট তৈরি হয়েছে! এখন লগইন পেজে যেতে পারেন।';
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
      }
    });
  </script>
</body>
</html>
