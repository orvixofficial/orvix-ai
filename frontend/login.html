<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orvix AI - Account</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .container { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid #334155; box-sizing: border-box; }
    h2 { text-align: center; margin-bottom: 5px; }
    .subtitle { text-align: center; color: #94a3b8; margin-bottom: 20px; font-size: 13px; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; }
    .btn-google { background: #ffffff; color: #1e293b; }
    .btn-github { background: #24292e; color: #ffffff; }
    .divider { display: flex; align-items: center; text-align: center; color: #64748b; margin: 15px 0; font-size: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #334155; }
    .divider::before { margin-right: .75em; } .divider::after { margin-left: .75em; }
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 4px; }
    .input-group input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; box-sizing: border-box; }
    .btn-submit { background: #3b82f6; color: white; margin-top: 5px; }
    .msg { font-size: 12px; text-align: center; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Orvix AI</h2>
    <p class="subtitle">একাউন্ট তৈরি বা লগইন করুন</p>

    <div id="msg" class="msg"></div>

    <!-- গুগল লগইন -->
    <button id="google-btn" class="btn btn-google">Google দিয়ে চালিয়ে যান</button>
    <!-- গিটহাব লগইন -->
    <button id="github-btn" class="btn btn-github">GitHub দিয়ে চালিয়ে যান</button>

    <div class="divider">অথवा ইমেইল দিয়ে</div>

    <!-- ম্যানুয়াল ফর্ম -->
    <form id="auth-form">
      <div class="input-group">
        <label>ইমেইল</label>
        <input type="email" id="email" required placeholder="example@domain.com">
      </div>
      <div class="input-group">
        <label>পাসওয়ার্ড</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-submit">সাবমিট করুন</button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://evdchqddhuzbgyexdnyq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV2ZGNoaWRkaHV6Ymd5ZXhkbnlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA2ODYwNzUsImV4cCI6MjA2NjI2MjA3NX0.zVvG5Vq7vYvG5Vq7vYvG5Vq7vYvG5Vq7vYvG5Vq7vYv';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const msgBox = document.getElementById('msg');
    const chatUrl = '/chat.html'; // আপনার চ্যাট পেজের পাথ (প্রয়োজনে /frontend/chat.html দিন)

    // ম্যানুয়াল ইমেইল দিয়ে সাইন আপ বা লগইন
    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // প্রথমে লগইন করার চেষ্টা করবে, একাউন্ট না থাকলে সাইনআপ করবে
      let { data, error } = await supabase.auth.signInWithPassword({ email, password });
      
      if (error) {
        // লগইন না হলে নতুন অ্যাকাউন্ট তৈরি করার চেষ্টা করবে
        let signUpRes = await supabase.auth.signUp({ email, password });
        if (signUpRes.error) {
          msgBox.style.color = '#ef4444';
          msgBox.textContent = 'ত্রুটি: ' + signUpRes.error.message;
        } else {
          msgBox.style.color = '#22c55e';
          msgBox.textContent = 'সফলভাবে অ্যাকাউন্ট তৈরি হয়েছে! চ্যাটে নেওয়া হচ্ছে...';
          setTimeout(() => window.location.href = chatUrl, 1500);
        }
      } else {
        msgBox.style.color = '#22c55e';
        msgBox.textContent = 'লগইন সফল হয়েছে!';
        setTimeout(() => window.location.href = chatUrl, 1000);
      }
    });

    // গুগল লগইন
    document.getElementById('google-btn').addEventListener('click', async () => {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + chatUrl }
      });
      if (error) alert(error.message);
    });

    // গিটহাব লগইন
    document.getElementById('github-btn').addEventListener('click', async () => {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'github',
        options: { redirectTo: window.location.origin + chatUrl }
      });
      if (error) alert(error.message);
    });
  </script>
</body>
</html>
